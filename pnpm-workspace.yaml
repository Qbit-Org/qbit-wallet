packages:
  - 'packages/*'
  - 'apps/extension'

# pnpm 11 reads its settings from this file, in camelCase only. It ignores
# kebab-case keys here, every .npmrc setting except auth and registry, and
# the pnpm field of package.json.

nodeLinker: hoisted

# pnpm 8 linked a dependency on a workspace package by default; pnpm 11 does
# not. Every workspace dependency uses workspace:*, and this keeps any other
# range on a workspace package name from resolving from the registry.
linkWorkspacePackages: true

# pnpm 11 installs before `pnpm run` and `pnpm exec` when node_modules is out
# of date; pnpm 8 never did. Every install stays an explicit command that the
# dependency policy reviews.
verifyDepsBeforeRun: false

overrides:
  '@babel/plugin-transform-modules-systemjs': '7.29.4'
  '@babel/traverse': '7.29.0'
  '@isaacs/brace-expansion': '5.0.1'
  '@lerna/create@9>js-yaml': '4.3.2'
  '@lerna/create@9>minimatch': '3.1.5'
  '@nx/devkit': '22.7.9'
  '@nx/devkit@22>minimatch': '10.2.6'
  '@trivago/prettier-plugin-sort-imports@4>lodash': '4.18.1'
  '@vitest/coverage-v8': '3.2.6'
  '@vitest/ui': '3.2.6'
  'axios': '1.20.0'
  'brace-expansion': '5.0.11'
  'braces': '3.0.3'
  'browserslist': '4.28.7'
  'cosmiconfig@9>js-yaml': '4.3.2'
  'fast-uri': '3.1.7'
  'flatted': '3.4.2'
  'follow-redirects': '1.16.2'
  'handlebars': '4.7.10'
  'http-cache-semantics': '4.3.0'
  'immutable': '5.1.8'
  'ip-address': '10.3.1'
  'js-yaml@3': '3.15.2'
  'js-yaml@4': '4.3.2'
  'json-schema': '0.4.0'
  'lerna@9>js-yaml': '4.3.2'
  'lerna@9>minimatch': '3.1.5'
  'lodash': '4.18.1'
  'multimatch@5>minimatch': '3.1.5'
  'node-forge': '1.4.0'
  'nx': '22.7.9'
  'nx@22>minimatch': '10.2.6'
  'pacote': '21.5.1'
  'path-to-regexp': '0.1.13'
  'probe-image-size': '7.4.0'
  'react-redux': '^8.0.5'
  'serialize-javascript': '7.0.3'
  'shell-quote': '1.11.0'
  'sigstore': '4.1.1'
  'smol-toml': '1.7.1'
  'source-map-js': '1.2.2'
  'svgo@3': '3.3.5'
  'svgo@4': '4.1.0'
  'tar': '7.5.22'
  'tinypool': '2.1.2'
  'vinyl-contents@2>bl': '4.1.0'
  'vite': '6.4.4'
  'vitest': '3.2.6'
  'websocket-driver': '0.7.5'

patchedDependencies:
  'bitcore-lib@10.0.0': 'patches/bitcore-lib@10.0.0.patch'
  'tiny-secp256k1@2.2.3': 'patches/tiny-secp256k1@2.2.3.patch'
  'bitcoinjs-lib@6.1.8': 'patches/bitcoinjs-lib@6.1.8.patch'

# pnpm 11 runs no dependency lifecycle script unless allowBuilds approves it,
# and fails the install for a package with a script that is not listed here.
# None of these scripts is needed; the dependency policy rejects `true` for a
# package it has not reviewed (REVIEWED_BUILD_DEPENDENCIES).
allowBuilds:
  '@parcel/watcher': false
  'core-js': false
  'core-js-pure': false
  'esbuild': false
  'fsevents': false
  'nx': false
  'secp256k1': false
