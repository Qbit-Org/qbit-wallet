name: Browser release gate

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: browser-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tree pass marker (docs/ci-tree-pass-marker.md): on a pull request whose tree
# under test already passed `Playwright G3 scenarios` and its shards in an
# earlier run that GitHub confirms, those jobs skip their steps. Bump
# TREE_PASS_WORKFLOW_SALT to invalidate this workflow's markers; the
# TREE_PASS_SALT repository variable invalidates every workflow's markers
# without a commit. The TREE_PASS_FORCE_LABEL label on a pull request makes it
# run in full.
#
# Docs-only changes (docs/ci-docs-only.md): on a pull request that changes only
# documentation that no skipped step reads, the same jobs skip their steps the
# same way, with no marker involved, and nothing is saved. The same label makes
# such a pull request run in full too.
#
# Signed heads (docs/playwright-release-gate.md): a pull request lands as one
# signed commit, so on a pull request whose head commit GitHub has not
# verified as signed, and which neither the label, a marker nor a docs-only
# change already decided, G3 waits for a signed head. No shard starts, the
# required job reports under another name, so the waiting run reports no check
# under the required check's name, and nothing is saved. Every doubt or error
# in that decision runs G3 in full under the required check's name.
env:
  TREE_PASS_WORKFLOW: browser-release-gate
  TREE_PASS_WORKFLOW_SALT: '1'
  TREE_PASS_REPOSITORY_SALT: ${{ vars.TREE_PASS_SALT }}
  TREE_PASS_FORCE_LABEL: 'ci:full-run'

jobs:
  tree-pass:
    name: Tree pass marker
    # Pull requests only, so no other event waits for a GitHub-hosted runner.
    # The covered jobs treat a skipped tree-pass as "run everything", and the
    # save job then never runs.
    if: github.event_name == 'pull_request'
    # GitHub-hosted on purpose: Blacksmith runners serve actions/cache from
    # Blacksmith's own store, and the marker relies on GitHub's cache scoping.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This job only looks markers up; it can never write one.
    cache-mode: read
    # actions: read lets decide read the run, jobs and artifact a marker names,
    # and this workflow's runs on the head branch; pull-requests: read, the
    # labels, the pull requests from the head branch, and this pull request's
    # timeline and issue events.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      prefix: ${{ steps.key.outputs.prefix }}
      skip: ${{ steps.decide.outputs.skip }}
      save: ${{ steps.decide.outputs.save }}
      run-url: ${{ steps.decide.outputs.run-url }}
      docs-only: ${{ steps.docs-only.outputs.docs-only }}
      signed-head-wait: ${{ steps.signed-head.outputs.wait }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The merge under test and its parents, for the head's tree.
          fetch-depth: 2

      # The script needs only Node's built-in modules, so the runner image's
      # Node (22 on ubuntu-24.04) runs it, without a download that could fail.
      - name: Compute the marker key
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_PASS_PR_NUMBER: ${{ github.event.pull_request.number }}
          TREE_PASS_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          TREE_PASS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/security/tree-pass-marker.mjs key

      - name: Look up the marker
        id: lookup
        if: steps.key.outputs.eligible == 'true'
        # Any failure of the lookup means a full run, never a skip.
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/tree-pass-marker
          # A marker's key is this prefix plus the run ID and attempt that saved
          # it, and the newest match wins. Lookup-only: the entry is never
          # downloaded or extracted, only its key is read.
          key: ${{ steps.key.outputs.prefix }}
          restore-keys: ${{ steps.key.outputs.prefix }}
          lookup-only: true

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_PASS_ELIGIBLE: ${{ steps.key.outputs.eligible }}
          TREE_PASS_PREFIX: ${{ steps.key.outputs.prefix }}
          TREE_PASS_HEAD_TREE: ${{ steps.key.outputs.head-tree }}
          TREE_PASS_LOOKUP_OUTCOME: ${{ steps.lookup.outcome }}
          TREE_PASS_MATCHED_KEY: ${{ steps.lookup.outputs.cache-matched-key }}
          TREE_PASS_PR_NUMBER: ${{ github.event.pull_request.number }}
          TREE_PASS_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          TREE_PASS_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          # The names of the jobs the marker covers, which must have passed in
          # the run a marker names: the required job and each shard, by the
          # name GitHub gives each leg of the shard matrix.
          TREE_PASS_COVERED_JOBS: '["Playwright G3 scenarios", "Playwright G3 shard 1 of 5", "Playwright G3 shard 2 of 5", "Playwright G3 shard 3 of 5", "Playwright G3 shard 4 of 5", "Playwright G3 shard 5 of 5"]'
        run: node scripts/security/tree-pass-marker.mjs decide

      # Whether the pull request changes only documentation that no skipped
      # step reads, judged from the merge under test against its base and the
      # labels read now. It never touches the marker. Any doubt or error there
      # sets false, a full run, and leaves the step green; a wiring error fails
      # it, and with it this job, which also means a full run.
      - name: Check for a docs-only change
        id: docs-only
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_PASS_PR_NUMBER: ${{ github.event.pull_request.number }}
          TREE_PASS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/security/docs-only-change.mjs

      # Whether G3 waits for a signed head. It comes last and reads the
      # marker's and the docs-only change's verdicts first: either of them
      # means it does not wait, and it sends no request. Otherwise it reads the
      # labels, and the force label means it does not wait either. Only then
      # does it read GitHub's verification of the head commit from this
      # repository, a fork's head included. It sets wait=true only when GitHub
      # answered for that commit that it is not verified, for a reason that
      # says for certain that it is not validly signed. Any doubt or error sets
      # false, a full run, and leaves the step green; a wiring error fails it,
      # and with it this job, which also means a full run. The settings that
      # only a request needs, the token among them, are checked when it sends
      # one.
      - name: Check whether the head commit is signed
        id: signed-head
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_PASS_PR_NUMBER: ${{ github.event.pull_request.number }}
          TREE_PASS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TREE_PASS_MARKER_SKIP: ${{ steps.decide.outputs.skip }}
          TREE_PASS_DOCS_ONLY: ${{ steps.docs-only.outputs.docs-only }}
        run: node scripts/security/signed-head-gate.mjs

  playwright-g3-shard:
    name: Playwright G3 shard ${{ matrix.shard }} of 5
    needs: tree-pass
    # Not a required check: `Playwright G3 scenarios` below is, and it passes
    # only when every shard passed. Each shard runs unless the run is
    # cancelled or waits for a signed head: on a marker hit only its steps are
    # skipped, and a failed or skipped marker job runs everything. A cancelled
    # run stops it. While the run waits for a signed head, which a marker job
    # that did not succeed never means, the whole matrix is skipped, so no
    # shard takes a runner.
    if: ${{ !cancelled() && !(needs.tree-pass.result == 'success' && needs.tree-pass.outputs.signed-head-wait == 'true') }}
    strategy:
      # Every shard finishes and uploads its own report, whatever the others do.
      fail-fast: false
      matrix:
        # Playwright's --shard=<shard>/5 below splits the suite into 5 parts by
        # whole files, in file order, with playwright.config.ts unchanged. The
        # list must be exactly 1 to 5. The total in --shard and in the job
        # name, the outputs, `Playwright G3 scenarios` and
        # TREE_PASS_COVERED_JOBS follow it; the wiring test checks each one.
        shard: [1, 2, 3, 4, 5]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The longest shard takes about 12.5 minutes with its setup. The longest
    # test timeout is the wipe/restore scenario's 15 minutes: that test
    # failing at its timeout and again on its retry, with the rest of its
    # shard and the setup, still ends by about 40 minutes. A hang outside a
    # test's own timeout (the regtest fixture has a separate 480 s one) can
    # run longer, and cutting such a run off is the point: a hang holds a
    # runner, and the required check waits for the slowest shard.
    timeout-minutes: 45
    # One output per shard, each set only by that shard's last step. The legs
    # of a matrix job share its outputs, and an output that two legs set holds
    # whichever finished last, so one name would let one shard's pass stand
    # for another's. An empty output is not recorded, so a leg leaves the
    # others' outputs alone.
    outputs:
      tested-1: ${{ steps.tested.outputs.tested-1 }}
      tested-2: ${{ steps.tested.outputs.tested-2 }}
      tested-3: ${{ steps.tested.outputs.tested-3 }}
      tested-4: ${{ steps.tested.outputs.tested-4 }}
      tested-5: ${{ steps.tested.outputs.tested-5 }}
    env:
      CI: 'true'
      QBIT_REGTEST_REQUIRED: '1'
      QBITD_IMAGE: qbit-wallet/qbitd-regtest:v1.0.0
      QBITD_PULL_POLICY: never
      ELECTRS_QBIT_IMAGE: ghcr.io/qbit-org/electrs-qbit-regtest:5da0ce5f2da657dab6dd74b8108cb2b3e17da1e2@sha256:2b84bc3d4c56f700e36c9d70f8dc92c2e6d383c4251c8bf48dcb4606a5d7e6d1
      ELECTRS_QBIT_PULL_POLICY: never
      # This leg's shard, for the steps below.
      G3_SHARD: ${{ matrix.shard }}

    steps:
      - name: Check for a tree pass marker
        id: gate
        env:
          MARKER_JOB_RESULT: ${{ needs.tree-pass.result }}
          MARKER_SKIP: ${{ needs.tree-pass.outputs.skip }}
          MARKER_RUN_URL: ${{ needs.tree-pass.outputs.run-url }}
          DOCS_ONLY: ${{ needs.tree-pass.outputs.docs-only }}
        run: |
          if [ "$MARKER_JOB_RESULT" = success ] && [ "$MARKER_SKIP" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This tree already passed this job in $MARKER_RUN_URL, so its steps are skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MARKER_JOB_RESULT" = success ] && [ "$DOCS_ONLY" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This pull request changes only documentation that no skipped step reads, so its steps are skipped. Add the $TREE_PASS_FORCE_LABEL label and re-run all jobs to run everything." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Run pnpm through Corepack
        if: steps.gate.outputs.skip != 'true'
        # Corepack installs the pnpm that package.json's packageManager pins and
        # checks it against the pin's sha512 hash. No earlier step runs pnpm.
        # Its shim must come first on PATH, so package scripts that call `pnpm`
        # run the checked pnpm too.
        run: |
          corepack enable
          test "$(dirname "$(command -v pnpm)")" = "$(dirname "$(command -v node)")"

      - name: Locate the pnpm store
        id: pnpm-store
        if: steps.gate.outputs.skip != 'true'
        run: |
          store_path="$(corepack pnpm store path --silent)"
          echo "path=${store_path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        if: steps.gate.outputs.skip != 'true'
        # The checked pnpm above names the store, and the key is the runner OS
        # and the lockfile.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install repository dependencies
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm install --frozen-lockfile

      - name: Install repository Playwright browser
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Build Chrome MV3 extension
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm test:e2e:build

      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pinned qbitd regtest image
        if: steps.gate.outputs.skip != 'true'
        run: >-
          docker build
          --file docker/regtest/qbitd-release.Dockerfile
          --tag "$QBITD_IMAGE"
          docker/regtest

      - name: Pull pinned electrs-qbit image
        if: steps.gate.outputs.skip != 'true'
        run: |
          docker pull "$ELECTRS_QBIT_IMAGE"

      - name: Run browser release gate
        if: steps.gate.outputs.skip != 'true'
        run: xvfb-run --auto-servernum corepack pnpm exec playwright test --shard="$G3_SHARD/5"

      # Each shard's own report, under a name unique to the shard and attempt.
      - name: Upload Playwright release-gate artifacts
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-release-gate-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results/playwright
            !test-results/playwright/**/chromium-profile/**
          if-no-files-found: warn
          retention-days: 14

      - name: Stop qbit regtest harness
        if: always() && steps.gate.outputs.skip != 'true'
        run: corepack pnpm regtest:down

      - name: Record that this shard ran
        id: tested
        if: steps.gate.outputs.skip != 'true'
        run: echo "tested-$G3_SHARD=true" >> "$GITHUB_OUTPUT"

  playwright-release-gate:
    # The required check's name, except while the run waits for a signed head:
    # then the job reports under another name, so this run reports no check
    # named `Playwright G3 scenarios`. Where that check is required, it stays
    # pending, neither passing nor failing, unless an earlier run on the same
    # commit already reported it. Every other state, a failed, cancelled or
    # skipped marker job and its empty outputs included, gives the real
    # name.
    name: ${{ needs.tree-pass.result == 'success' && needs.tree-pass.outputs.signed-head-wait == 'true' && 'Playwright G3 scenarios (waits for a signed head)' || 'Playwright G3 scenarios' }}
    needs: [tree-pass, playwright-g3-shard]
    # A required check, which reports the shards' combined result, never
    # "skipped": its check step fails unless the shards' result is success.
    # It runs even in a cancelled run, so the check does not depend on how
    # GitHub reports a job that never started there. A cancellation that
    # leaves a shard without success, such as a newer push while the shards
    # run, shows failure on the older commit; one after every shard passed
    # shows the shards' real result. One that lands before this job can start
    # may still show cancelled, which does not pass either. It is a few shell
    # lines, so that it cannot be cancelled costs nothing. On a marker hit or a
    # docs-only change only its last step is skipped, and a failed marker job
    # runs everything. While the run waits for a signed head it still runs,
    # under the other name: its check step then passes only when the shards
    # were skipped and none ran, and its last step is skipped.
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    # It reads only `needs`: no checkout, no token.
    permissions: {}
    outputs:
      tested: ${{ steps.tested.outputs.tested }}

    steps:
      # A marker hit and a docs-only change set skip. Failing both, a
      # successful marker job that says the run waits for a signed head sets
      # wait instead, never skip: the shards were skipped whole, not run.
      - name: Check for a tree pass marker
        id: gate
        env:
          MARKER_JOB_RESULT: ${{ needs.tree-pass.result }}
          MARKER_SKIP: ${{ needs.tree-pass.outputs.skip }}
          MARKER_RUN_URL: ${{ needs.tree-pass.outputs.run-url }}
          DOCS_ONLY: ${{ needs.tree-pass.outputs.docs-only }}
          SIGNED_HEAD_WAIT: ${{ needs.tree-pass.outputs.signed-head-wait }}
        run: |
          if [ "$MARKER_JOB_RESULT" = success ] && [ "$MARKER_SKIP" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This tree already passed this job in $MARKER_RUN_URL, so the shards skipped their steps; this job still checks that every shard succeeded." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MARKER_JOB_RESULT" = success ] && [ "$DOCS_ONLY" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This pull request changes only documentation that no skipped step reads, so the shards skipped their steps; this job still checks that every shard succeeded. Add the $TREE_PASS_FORCE_LABEL label and re-run all jobs to run everything." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MARKER_JOB_RESULT" = success ] && [ "$SIGNED_HEAD_WAIT" = true ]; then
            echo 'wait=true' >> "$GITHUB_OUTPUT"
            echo "GitHub has not verified the signature of this pull request's head commit, so G3 waits for a signed head and no shard started; this job checks that none did. To run G3, sign the head commit and push it, or add the $TREE_PASS_FORCE_LABEL label and re-run all jobs." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Runs on a marker hit or a docs-only change too, when the gate said
      # skip (MARKER_HIT): every shard must have succeeded, having skipped its
      # steps by the same decision. Otherwise each shard must also have run all
      # its steps. A failed, cancelled, timed-out or skipped shard, or one that
      # recorded nothing, fails this job. While the run waits for a signed head
      # (SIGNED_HEAD_WAIT), the shards' result must be skipped instead and no
      # shard may have recorded anything; anything else fails this job.
      - name: Check every shard ran and passed
        env:
          SHARDS_RESULT: ${{ needs.playwright-g3-shard.result }}
          MARKER_HIT: ${{ steps.gate.outputs.skip }}
          SIGNED_HEAD_WAIT: ${{ steps.gate.outputs.wait }}
          SHARD_1_TESTED: ${{ needs.playwright-g3-shard.outputs.tested-1 }}
          SHARD_2_TESTED: ${{ needs.playwright-g3-shard.outputs.tested-2 }}
          SHARD_3_TESTED: ${{ needs.playwright-g3-shard.outputs.tested-3 }}
          SHARD_4_TESTED: ${{ needs.playwright-g3-shard.outputs.tested-4 }}
          SHARD_5_TESTED: ${{ needs.playwright-g3-shard.outputs.tested-5 }}
        run: |
          status=0
          if [ "$SIGNED_HEAD_WAIT" = true ]; then
            if [ "$SHARDS_RESULT" != skipped ]; then
              echo "::error::This run waits for a signed head, so the shards should have been skipped, but their result is \"$SHARDS_RESULT\"."
              status=1
            fi
            for shard in 1 2 3 4 5; do
              tested="SHARD_${shard}_TESTED"
              if [ -n "${!tested}" ]; then
                echo "::error::Shard $shard of 5 recorded that it ran, though this run waits for a signed head."
                status=1
              fi
            done
            if [ "$status" = 0 ]; then
              echo "::notice::G3 waits for a signed head. To run G3, sign the head commit and push it, or add the $TREE_PASS_FORCE_LABEL label and re-run all jobs."
            fi
            exit "$status"
          fi
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::The shards' result is \"$SHARDS_RESULT\", not success; see each shard's job."
            status=1
          fi
          if [ "$MARKER_HIT" != true ]; then
            for shard in 1 2 3 4 5; do
              tested="SHARD_${shard}_TESTED"
              if [ "${!tested}" != true ]; then
                echo "::error::Shard $shard of 5 did not run all its steps."
                status=1
              fi
            done
          fi
          exit "$status"

      # Nothing ran while the run waits for a signed head, so nothing is
      # recorded then either.
      - name: Record that every shard ran
        id: tested
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.wait != 'true'
        run: echo 'tested=true' >> "$GITHUB_OUTPUT"

  tree-pass-save:
    name: Record tree pass
    # Every job the marker stands for: the shards through
    # `Playwright G3 scenarios`, which needs them all and reports tested=true
    # only when each shard passed and reported its own tested-<n>. The
    # implicit success() also requires it, and tree-pass, to have succeeded;
    # the record step checks them again.
    needs: [tree-pass, playwright-release-gate]
    # A docs-only run skipped the covered jobs' steps, and a run that waits for
    # a signed head skipped the shards whole, so neither has a pass to record.
    # The implicit success() already requires a successful tree-pass, so its
    # wait output alone tells a waiting run.
    if: needs.tree-pass.outputs.save == 'true' && needs.tree-pass.outputs.docs-only != 'true' && needs.tree-pass.outputs.signed-head-wait != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This job only writes the marker; it never restores one.
    cache-mode: write-only
    # pull-requests: read lets the record step read the labels again, since a
    # re-run of failed jobs reuses tree-pass's decision.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check every covered job ran and passed
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_PASS_NEEDS: ${{ toJSON(needs) }}
          TREE_PASS_PR_NUMBER: ${{ github.event.pull_request.number }}
          TREE_PASS_MARKER_DIR: ${{ runner.temp }}/tree-pass-marker
        run: node scripts/security/tree-pass-marker.mjs record

      # The artifact binds the key to this run: decide finds it by name in the
      # run the key names. It comes first, so a marker never exists without it.
      # A marker that cannot be recorded only means the next run runs in full.
      - name: Upload the marker artifact
        id: upload
        if: steps.record.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: ${{ runner.temp }}/tree-pass-marker
          if-no-files-found: error
          retention-days: 14

      - name: Save the marker
        if: steps.record.outputs.ok == 'true' && steps.upload.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/tree-pass-marker
          key: ${{ steps.record.outputs.key }}
