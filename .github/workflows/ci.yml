name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        # Only for setup-node's pnpm store cache. The action installs the
        # packageManager version from the registry without checking its sha512
        # hash, so no pnpm command below runs it.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Run pnpm through Corepack
        # Corepack installs the pnpm that package.json's packageManager pins and
        # checks it against the pin's sha512 hash. Its shim must come first on
        # PATH, so package scripts that call `pnpm` run the checked pnpm too.
        run: |
          corepack enable
          test "$(command -v pnpm)" = "$(dirname "$(command -v node)")/pnpm"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run deterministic repository lint
        run: corepack pnpm lint

  dependency-policy:
    name: Dependency policy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        # Only for setup-node's pnpm store cache. The action installs the
        # packageManager version from the registry without checking its sha512
        # hash, so no pnpm command below runs it.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Run pnpm through Corepack
        # Corepack installs the pnpm that package.json's packageManager pins and
        # checks it against the pin's sha512 hash. Its shim must come first on
        # PATH, so package scripts that call `pnpm` run the checked pnpm too.
        run: |
          corepack enable
          test "$(command -v pnpm)" = "$(dirname "$(command -v node)")/pnpm"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Test dependency policy fail-closed behavior
        run: corepack pnpm test:security-tooling

      - name: Enforce dependency and license policy
        run: corepack pnpm security:dependencies

  verify:
    name: Typecheck, test, and build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        # Only for setup-node's pnpm store cache. The action installs the
        # packageManager version from the registry without checking its sha512
        # hash, so no pnpm command below runs it.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Run pnpm through Corepack
        # Corepack installs the pnpm that package.json's packageManager pins and
        # checks it against the pin's sha512 hash. Its shim must come first on
        # PATH, so package scripts that call `pnpm` run the checked pnpm too.
        run: |
          corepack enable
          test "$(command -v pnpm)" = "$(dirname "$(command -v node)")/pnpm"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Report release readiness without changing GitHub settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: corepack pnpm run release:readiness -- --report-only

      - name: Prepare workspace declarations
        run: corepack pnpm -r --if-present --filter './packages/**' --filter '!@qbit/wallet-background' run build

      - name: Build wallet background package
        run: corepack pnpm --filter @qbit/wallet-background run build

      - name: Run adversarial security suite
        run: corepack pnpm run test:security-adversarial

      - name: Typecheck packages
        run: corepack pnpm -r --if-present run typecheck

      - name: Run unit tests
        run: |
          corepack pnpm -r --if-present test
          corepack pnpm run test:pqc-golden
          corepack pnpm run test:protocol-vectors

      - name: Resolve extension artifact version
        id: extension-version
        run: |
          artifact_version="$(node -p "require('./apps/extension/package.json').version.split('-beta')[0]")"
          echo "artifact_version=${artifact_version}" >> "$GITHUB_OUTPUT"

      - name: Build Chrome MV3 extension
        run: corepack pnpm --filter qbit-extension run package:test -- --artifact-version "${{ steps.extension-version.outputs.artifact_version }}"

      - name: Verify two clean extension builds are byte-identical
        run: corepack pnpm run build:repro:extension -- --skip-prepare

      - name: Upload Chrome MV3 extension artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-mv3-extension
          path: apps/extension/dist/qbit-chrome-mv3-v*.zip*
          if-no-files-found: error
          retention-days: 14
