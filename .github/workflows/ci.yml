name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tree pass marker (docs/ci-tree-pass-marker.md): on a pull request whose tree
# under test already passed `Lint`, `Typecheck, test, and build` and its lanes
# in an earlier run that GitHub confirms, those jobs skip their work. Bump
# TREE_PASS_WORKFLOW_SALT to invalidate this workflow's markers; the
# TREE_PASS_SALT repository variable invalidates every workflow's markers
# without a commit. The TREE_PASS_FORCE_LABEL label on a pull request makes it
# run in full.
#
# Docs-only changes (docs/ci-docs-only.md): on a pull request that changes only
# documentation that no skipped step reads, `Typecheck, test, and build` and
# its lanes skip their steps the same way, with no marker involved, and
# nothing is saved. `Lint` still runs, and so does the lane
# `Typecheck, security checks and other unit tests`, whose security tooling
# tests read every tracked file. The same label makes such a pull request run
# in full too.
env:
  TREE_PASS_WORKFLOW: ci
  TREE_PASS_WORKFLOW_SALT: '1'
  TREE_PASS_REPOSITORY_SALT: ${{ vars.TREE_PASS_SALT }}
  TREE_PASS_FORCE_LABEL: 'ci:full-run'

jobs:
  tree-pass:
    name: Tree pass marker
    # Pull requests only, so no other event waits for a GitHub-hosted runner.
    # The covered jobs treat a skipped tree-pass as "run everything", and the
    # save job then never runs.
    if: github.event_name == 'pull_request'
    # GitHub-hosted on purpose: Blacksmith runners serve actions/cache from
    # Blacksmith's own store, and the marker relies on GitHub's cache scoping.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This job only looks markers up; it can never write one.
    cache-mode: read
    # actions: read lets decide read the run, jobs and artifact a marker names,
    # and this workflow's runs on the head branch; pull-requests: read, the
    # labels, the pull requests from the head branch, and this pull request's
    # timeline and issue events.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      prefix: ${{ steps.key.outputs.prefix }}
      skip: ${{ steps.decide.outputs.skip }}
      save: ${{ steps.decide.outputs.save }}
      run-url: ${{ steps.decide.outputs.run-url }}
      docs-only: ${{ steps.docs-only.outputs.docs-only }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The merge under test and its parents, for the head's tree.
          fetch-depth: 2

      # The script needs only Node's built-in modules, so the runner image's
      # Node (22 on ubuntu-24.04) runs it, without a download that could fail.
      - name: Compute the marker key
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_PASS_PR_NUMBER: ${{ github.event.pull_request.number }}
          TREE_PASS_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          TREE_PASS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/security/tree-pass-marker.mjs key

      - name: Look up the marker
        id: lookup
        if: steps.key.outputs.eligible == 'true'
        # Any failure of the lookup means a full run, never a skip.
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/tree-pass-marker
          # A marker's key is this prefix plus the run ID and attempt that saved
          # it, and the newest match wins. Lookup-only: the entry is never
          # downloaded or extracted, only its key is read.
          key: ${{ steps.key.outputs.prefix }}
          restore-keys: ${{ steps.key.outputs.prefix }}
          lookup-only: true

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_PASS_ELIGIBLE: ${{ steps.key.outputs.eligible }}
          TREE_PASS_PREFIX: ${{ steps.key.outputs.prefix }}
          TREE_PASS_HEAD_TREE: ${{ steps.key.outputs.head-tree }}
          TREE_PASS_LOOKUP_OUTCOME: ${{ steps.lookup.outcome }}
          TREE_PASS_MATCHED_KEY: ${{ steps.lookup.outputs.cache-matched-key }}
          TREE_PASS_PR_NUMBER: ${{ github.event.pull_request.number }}
          TREE_PASS_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          TREE_PASS_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          # The names of the jobs the marker covers, which must have passed in
          # the run a marker names: Lint, the required job and each of its
          # lanes.
          TREE_PASS_COVERED_JOBS: '["Lint", "Typecheck, test, and build", "Unit tests: qbit-extension", "Unit tests: wallet-background", "Typecheck, security checks and other unit tests", "Build and reproduce the extension"]'
        run: node scripts/security/tree-pass-marker.mjs decide

      # Whether the pull request changes only documentation that no skipped
      # step reads, judged from the merge under test against its base and the
      # labels read now. It never touches the marker. Any doubt or error there
      # sets false, a full run, and leaves the step green; a wiring error fails
      # it, and with it this job, which also means a full run.
      - name: Check for a docs-only change
        id: docs-only
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_PASS_PR_NUMBER: ${{ github.event.pull_request.number }}
          TREE_PASS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/security/docs-only-change.mjs

  lint:
    name: Lint
    needs: tree-pass
    # Lint is not a required check, so a marker hit skips the whole job. A
    # failed marker job never skips it, and neither does a docs-only change.
    if: ${{ !cancelled() && !(needs.tree-pass.result == 'success' && needs.tree-pass.outputs.skip == 'true') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      tested: ${{ steps.tested.outputs.tested }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Run pnpm through Corepack
        # Corepack installs the pnpm that package.json's packageManager pins and
        # checks it against the pin's sha512 hash. No earlier step runs pnpm.
        # Its shim must come first on PATH, so package scripts that call `pnpm`
        # run the checked pnpm too.
        run: |
          corepack enable
          test "$(dirname "$(command -v pnpm)")" = "$(dirname "$(command -v node)")"

      - name: Locate the pnpm store
        id: pnpm-store
        run: |
          store_path="$(corepack pnpm store path --silent)"
          echo "path=${store_path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        # The checked pnpm above names the store, and the key is the runner OS
        # and the lockfile.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run deterministic repository lint
        run: corepack pnpm lint

      - name: Record that this job ran
        id: tested
        run: echo 'tested=true' >> "$GITHUB_OUTPUT"

  # Not covered by the tree pass marker: its live advisory audit and dated
  # risk exceptions can change their verdict for the same tree.
  dependency-policy:
    name: Dependency policy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Run pnpm through Corepack
        # Corepack installs the pnpm that package.json's packageManager pins and
        # checks it against the pin's sha512 hash. No earlier step runs pnpm.
        # Its shim must come first on PATH, so package scripts that call `pnpm`
        # run the checked pnpm too.
        run: |
          corepack enable
          test "$(dirname "$(command -v pnpm)")" = "$(dirname "$(command -v node)")"

      - name: Locate the pnpm store
        id: pnpm-store
        run: |
          store_path="$(corepack pnpm store path --silent)"
          echo "path=${store_path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        # The checked pnpm above names the store, and the key is the runner OS
        # and the lockfile.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Test dependency policy fail-closed behavior
        run: corepack pnpm test:security-tooling

      - name: Enforce dependency and license policy
        run: corepack pnpm security:dependencies

  # A required check on the default branch and on release branches
  # (.github/rulesets): a change that sets the extension version must leave no
  # changeset pending, so a release always applies them
  # (docs/package-release.md). Not covered by the tree pass marker and never
  # skipped as docs-only: its verdict depends on the commit's first parent as
  # well as its tree, and it takes seconds. It waits for no other job and has
  # no condition, so it reports on every run.
  package-versions:
    name: Package versions applied
    # The script needs only Node's built-in modules, so the runner image's
    # Node runs it, without a download or an install that could fail.
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The commit under test and its first parent: on a pull request, the
          # merge and the base branch's tip.
          fetch-depth: 2

      - name: Check that a version change leaves no changeset pending
        run: node scripts/security/package-versions-applied.mjs

  # The work of `Typecheck, test, and build` runs in four lanes at once: the
  # two longest test suites each on their own, the remaining checks and
  # tests, and the extension build. Each lane is a job of its own, not a leg
  # of a matrix, because the lanes run different steps, and so that the job
  # below sees each lane's own result and names the one that failed. A lane
  # is not a required check. It runs unless the run is cancelled: on a marker
  # hit, or a docs-only change for every lane but verify-workspace, only its
  # steps are skipped, and a failed or skipped marker job runs everything. Its
  # 30 minutes are about four times the longest lane's measured time; a hang
  # holds a runner, and the required check waits for the slowest lane. Each
  # lane prepares the workspace itself, since the tests and the build read
  # the packages' built lib/.
  verify-extension-tests:
    name: 'Unit tests: qbit-extension'
    needs: tree-pass
    if: ${{ !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      tested: ${{ steps.tested.outputs.tested }}

    steps:
      - name: Check for a tree pass marker
        id: gate
        env:
          MARKER_JOB_RESULT: ${{ needs.tree-pass.result }}
          MARKER_SKIP: ${{ needs.tree-pass.outputs.skip }}
          MARKER_RUN_URL: ${{ needs.tree-pass.outputs.run-url }}
          DOCS_ONLY: ${{ needs.tree-pass.outputs.docs-only }}
        run: |
          if [ "$MARKER_JOB_RESULT" = success ] && [ "$MARKER_SKIP" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This tree already passed this job in $MARKER_RUN_URL, so its steps are skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MARKER_JOB_RESULT" = success ] && [ "$DOCS_ONLY" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This pull request changes only documentation that no skipped step reads, so its steps are skipped. Add the $TREE_PASS_FORCE_LABEL label and re-run all jobs to run everything." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Run pnpm through Corepack
        if: steps.gate.outputs.skip != 'true'
        # Corepack installs the pnpm that package.json's packageManager pins and
        # checks it against the pin's sha512 hash. No earlier step runs pnpm.
        # Its shim must come first on PATH, so package scripts that call `pnpm`
        # run the checked pnpm too.
        run: |
          corepack enable
          test "$(dirname "$(command -v pnpm)")" = "$(dirname "$(command -v node)")"

      - name: Locate the pnpm store
        id: pnpm-store
        if: steps.gate.outputs.skip != 'true'
        run: |
          store_path="$(corepack pnpm store path --silent)"
          echo "path=${store_path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        if: steps.gate.outputs.skip != 'true'
        # The checked pnpm above names the store, and the key is the runner OS
        # and the lockfile.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm install --frozen-lockfile

      - name: Prepare workspace declarations
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm -r --if-present --filter './packages/**' --filter '!@qbit/wallet-background' run build

      - name: Build wallet background package
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm --filter @qbit/wallet-background run build

      - name: Run qbit-extension unit tests
        if: steps.gate.outputs.skip != 'true'
        # Its node --test scripts, then its vitest suite.
        run: corepack pnpm --filter qbit-extension run test

      - name: Record that this job ran
        id: tested
        if: steps.gate.outputs.skip != 'true'
        run: echo 'tested=true' >> "$GITHUB_OUTPUT"

  verify-wallet-background-tests:
    name: 'Unit tests: wallet-background'
    needs: tree-pass
    if: ${{ !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      tested: ${{ steps.tested.outputs.tested }}

    steps:
      - name: Check for a tree pass marker
        id: gate
        env:
          MARKER_JOB_RESULT: ${{ needs.tree-pass.result }}
          MARKER_SKIP: ${{ needs.tree-pass.outputs.skip }}
          MARKER_RUN_URL: ${{ needs.tree-pass.outputs.run-url }}
          DOCS_ONLY: ${{ needs.tree-pass.outputs.docs-only }}
        run: |
          if [ "$MARKER_JOB_RESULT" = success ] && [ "$MARKER_SKIP" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This tree already passed this job in $MARKER_RUN_URL, so its steps are skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MARKER_JOB_RESULT" = success ] && [ "$DOCS_ONLY" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This pull request changes only documentation that no skipped step reads, so its steps are skipped. Add the $TREE_PASS_FORCE_LABEL label and re-run all jobs to run everything." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Run pnpm through Corepack
        if: steps.gate.outputs.skip != 'true'
        # Corepack installs the pnpm that package.json's packageManager pins and
        # checks it against the pin's sha512 hash. No earlier step runs pnpm.
        # Its shim must come first on PATH, so package scripts that call `pnpm`
        # run the checked pnpm too.
        run: |
          corepack enable
          test "$(dirname "$(command -v pnpm)")" = "$(dirname "$(command -v node)")"

      - name: Locate the pnpm store
        id: pnpm-store
        if: steps.gate.outputs.skip != 'true'
        run: |
          store_path="$(corepack pnpm store path --silent)"
          echo "path=${store_path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        if: steps.gate.outputs.skip != 'true'
        # The checked pnpm above names the store, and the key is the runner OS
        # and the lockfile.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm install --frozen-lockfile

      - name: Prepare workspace declarations
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm -r --if-present --filter './packages/**' --filter '!@qbit/wallet-background' run build

      - name: Build wallet background package
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm --filter @qbit/wallet-background run build

      - name: Run wallet-background unit tests
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm --filter @qbit/wallet-background run test

      - name: Record that this job ran
        id: tested
        if: steps.gate.outputs.skip != 'true'
        run: echo 'tested=true' >> "$GITHUB_OUTPUT"

  verify-workspace:
    name: Typecheck, security checks and other unit tests
    needs: tree-pass
    if: ${{ !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      tested: ${{ steps.tested.outputs.tested }}

    steps:
      # Only a marker hit skips this lane; a docs-only change does not. Its
      # security tooling tests read every tracked file, documentation
      # included (former-owner.test.mjs reads their contents), and this lane
      # is the one that runs them for a required check.
      - name: Check for a tree pass marker
        id: gate
        env:
          MARKER_JOB_RESULT: ${{ needs.tree-pass.result }}
          MARKER_SKIP: ${{ needs.tree-pass.outputs.skip }}
          MARKER_RUN_URL: ${{ needs.tree-pass.outputs.run-url }}
        run: |
          if [ "$MARKER_JOB_RESULT" = success ] && [ "$MARKER_SKIP" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This tree already passed this job in $MARKER_RUN_URL, so its steps are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Run pnpm through Corepack
        if: steps.gate.outputs.skip != 'true'
        # Corepack installs the pnpm that package.json's packageManager pins and
        # checks it against the pin's sha512 hash. No earlier step runs pnpm.
        # Its shim must come first on PATH, so package scripts that call `pnpm`
        # run the checked pnpm too.
        run: |
          corepack enable
          test "$(dirname "$(command -v pnpm)")" = "$(dirname "$(command -v node)")"

      - name: Locate the pnpm store
        id: pnpm-store
        if: steps.gate.outputs.skip != 'true'
        run: |
          store_path="$(corepack pnpm store path --silent)"
          echo "path=${store_path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        if: steps.gate.outputs.skip != 'true'
        # The checked pnpm above names the store, and the key is the runner OS
        # and the lockfile.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm install --frozen-lockfile

      - name: Report release readiness without changing GitHub settings
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: corepack pnpm run release:readiness -- --report-only

      - name: Prepare workspace declarations
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm -r --if-present --filter './packages/**' --filter '!@qbit/wallet-background' run build

      - name: Build wallet background package
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm --filter @qbit/wallet-background run build

      # The adversarial suite's test files run in the unit test lanes, under
      # their packages' own test scripts, which adversarial-tests.test.mjs
      # holds them to, so only the suite's other checks run here. Dependency policy runs the security tooling too, but
      # it is not a required check; the PQC workflow runs the SDK package
      # check only when its paths change.
      - name: Run security tooling tests and check SDK package pins
        if: steps.gate.outputs.skip != 'true'
        run: |
          corepack pnpm run test:security-tooling
          corepack pnpm run sdk:packages:check

      - name: Typecheck packages
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm -r --if-present run typecheck

      # Every workspace package's tests but the two that have lanes of their
      # own, so a new package's tests run here without a change to this file.
      - name: Run the other unit tests
        if: steps.gate.outputs.skip != 'true'
        run: |
          corepack pnpm -r --if-present --filter '!qbit-extension' --filter '!@qbit/wallet-background' test
          corepack pnpm run test:pqc-golden
          corepack pnpm run test:protocol-vectors

      - name: Record that this job ran
        id: tested
        if: steps.gate.outputs.skip != 'true'
        run: echo 'tested=true' >> "$GITHUB_OUTPUT"

  verify-package:
    name: Build and reproduce the extension
    needs: tree-pass
    if: ${{ !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      tested: ${{ steps.tested.outputs.tested }}

    steps:
      - name: Check for a tree pass marker
        id: gate
        env:
          MARKER_JOB_RESULT: ${{ needs.tree-pass.result }}
          MARKER_SKIP: ${{ needs.tree-pass.outputs.skip }}
          MARKER_RUN_URL: ${{ needs.tree-pass.outputs.run-url }}
          DOCS_ONLY: ${{ needs.tree-pass.outputs.docs-only }}
        run: |
          if [ "$MARKER_JOB_RESULT" = success ] && [ "$MARKER_SKIP" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This tree already passed this job in $MARKER_RUN_URL, so its steps are skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MARKER_JOB_RESULT" = success ] && [ "$DOCS_ONLY" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This pull request changes only documentation that no skipped step reads, so its steps are skipped. Add the $TREE_PASS_FORCE_LABEL label and re-run all jobs to run everything." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Run pnpm through Corepack
        if: steps.gate.outputs.skip != 'true'
        # Corepack installs the pnpm that package.json's packageManager pins and
        # checks it against the pin's sha512 hash. No earlier step runs pnpm.
        # Its shim must come first on PATH, so package scripts that call `pnpm`
        # run the checked pnpm too.
        run: |
          corepack enable
          test "$(dirname "$(command -v pnpm)")" = "$(dirname "$(command -v node)")"

      - name: Locate the pnpm store
        id: pnpm-store
        if: steps.gate.outputs.skip != 'true'
        run: |
          store_path="$(corepack pnpm store path --silent)"
          echo "path=${store_path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        if: steps.gate.outputs.skip != 'true'
        # The checked pnpm above names the store, and the key is the runner OS
        # and the lockfile.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm install --frozen-lockfile

      # build:repro:extension's --skip-prepare reads the packages' built lib/.
      - name: Prepare workspace declarations
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm -r --if-present --filter './packages/**' --filter '!@qbit/wallet-background' run build

      - name: Build wallet background package
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm --filter @qbit/wallet-background run build

      # This is the job's only extension build. The script builds twice from a
      # clean state, with the artifact version it reads from
      # apps/extension/package.json, and fails unless the two builds are
      # byte-identical. A separate build before it would be thrown away,
      # because the script deletes the ZIP and its output before each build.
      - name: Build Chrome MV3 extension twice and verify the builds are byte-identical
        if: steps.gate.outputs.skip != 'true'
        run: corepack pnpm run build:repro:extension -- --skip-prepare

      # The script leaves the second build's ZIP and sidecars in dist, and has
      # checked them byte for byte against the first build, so the artifact
      # is exactly what the step above compared.
      - name: Upload Chrome MV3 extension artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-mv3-extension
          path: apps/extension/dist/qbit-chrome-mv3-v*.zip*
          if-no-files-found: error
          retention-days: 14

      - name: Record that this job ran
        id: tested
        if: steps.gate.outputs.skip != 'true'
        run: echo 'tested=true' >> "$GITHUB_OUTPUT"

  verify:
    name: Typecheck, test, and build
    needs:
      - tree-pass
      - verify-extension-tests
      - verify-wallet-background-tests
      - verify-workspace
      - verify-package
    # A required check, which reports the lanes' combined result, never
    # "skipped": its check step fails unless every lane's result is success.
    # It runs even in a cancelled run, so the check does not depend on how
    # GitHub reports a job that never started there. A cancellation that
    # leaves a lane without success, such as a newer push while the lanes
    # run, shows failure on the older commit; one after every lane passed
    # shows the lanes' real result. One that lands before this job can start
    # may still show cancelled, which does not pass either. It is a few shell
    # lines, so that it cannot be cancelled costs nothing. On a marker hit or a
    # docs-only change only its last step is skipped, and a failed marker job
    # runs everything.
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    # It reads only `needs`: no checkout, no token.
    permissions: {}
    outputs:
      tested: ${{ steps.tested.outputs.tested }}

    steps:
      - name: Check for a tree pass marker
        id: gate
        env:
          MARKER_JOB_RESULT: ${{ needs.tree-pass.result }}
          MARKER_SKIP: ${{ needs.tree-pass.outputs.skip }}
          MARKER_RUN_URL: ${{ needs.tree-pass.outputs.run-url }}
          DOCS_ONLY: ${{ needs.tree-pass.outputs.docs-only }}
        run: |
          if [ "$MARKER_JOB_RESULT" = success ] && [ "$MARKER_SKIP" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This tree already passed this job in $MARKER_RUN_URL, so the lanes skipped their steps; this job still checks that every lane succeeded." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MARKER_JOB_RESULT" = success ] && [ "$DOCS_ONLY" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "This pull request changes only documentation that no skipped step reads, so the lanes skipped their steps, except 'Typecheck, security checks and other unit tests', which ran in full because its security tooling tests read every tracked file; this job still checks that every lane succeeded. Add the $TREE_PASS_FORCE_LABEL label and re-run all jobs to run everything." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Runs on a marker hit or a docs-only change too, when the gate said
      # skip (MARKER_HIT): every lane must have succeeded, having skipped its
      # steps by the same decision. Otherwise each lane must also have run all
      # its steps. A failed, cancelled, timed-out or skipped lane, or one that
      # recorded nothing, fails this job, and its error and summary name the
      # lane.
      - name: Check every lane ran and passed
        env:
          MARKER_HIT: ${{ steps.gate.outputs.skip }}
          VERIFY_EXTENSION_TESTS_RESULT: ${{ needs.verify-extension-tests.result }}
          VERIFY_EXTENSION_TESTS_TESTED: ${{ needs.verify-extension-tests.outputs.tested }}
          VERIFY_WALLET_BACKGROUND_TESTS_RESULT: ${{ needs.verify-wallet-background-tests.result }}
          VERIFY_WALLET_BACKGROUND_TESTS_TESTED: ${{ needs.verify-wallet-background-tests.outputs.tested }}
          VERIFY_WORKSPACE_RESULT: ${{ needs.verify-workspace.result }}
          VERIFY_WORKSPACE_TESTED: ${{ needs.verify-workspace.outputs.tested }}
          VERIFY_PACKAGE_RESULT: ${{ needs.verify-package.result }}
          VERIFY_PACKAGE_TESTED: ${{ needs.verify-package.outputs.tested }}
        run: |
          status=0
          fail() {
            echo "::error::$1"
            echo "- $1" >> "$GITHUB_STEP_SUMMARY"
            status=1
          }
          check_lane() {
            if [ "$2" != success ]; then
              fail "Lane \"$1\": its result is \"$2\", not success; see its job."
            elif [ "$MARKER_HIT" != true ] && [ "$3" != true ]; then
              fail "Lane \"$1\" did not run all its steps."
            fi
          }
          check_lane 'Unit tests: qbit-extension' "$VERIFY_EXTENSION_TESTS_RESULT" "$VERIFY_EXTENSION_TESTS_TESTED"
          check_lane 'Unit tests: wallet-background' "$VERIFY_WALLET_BACKGROUND_TESTS_RESULT" "$VERIFY_WALLET_BACKGROUND_TESTS_TESTED"
          check_lane 'Typecheck, security checks and other unit tests' "$VERIFY_WORKSPACE_RESULT" "$VERIFY_WORKSPACE_TESTED"
          check_lane 'Build and reproduce the extension' "$VERIFY_PACKAGE_RESULT" "$VERIFY_PACKAGE_TESTED"
          exit "$status"

      - name: Record that every lane ran
        id: tested
        if: steps.gate.outputs.skip != 'true'
        run: echo 'tested=true' >> "$GITHUB_OUTPUT"

  tree-pass-save:
    name: Record tree pass
    # Every job the marker stands for: Lint, each lane, and
    # `Typecheck, test, and build`, which needs the lanes. Each lane is a job
    # of its own with its own `tested`, so the record step reads each one
    # directly. The implicit success() also requires each of them, and
    # tree-pass, to have succeeded; the record step checks them again.
    needs:
      - tree-pass
      - lint
      - verify-extension-tests
      - verify-wallet-background-tests
      - verify-workspace
      - verify-package
      - verify
    # A docs-only run skipped the covered jobs' steps, so it has no pass to
    # record.
    if: needs.tree-pass.outputs.save == 'true' && needs.tree-pass.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This job only writes the marker; it never restores one.
    cache-mode: write-only
    # pull-requests: read lets the record step read the labels again, since a
    # re-run of failed jobs reuses tree-pass's decision.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check every covered job ran and passed
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_PASS_NEEDS: ${{ toJSON(needs) }}
          TREE_PASS_PR_NUMBER: ${{ github.event.pull_request.number }}
          TREE_PASS_MARKER_DIR: ${{ runner.temp }}/tree-pass-marker
        run: node scripts/security/tree-pass-marker.mjs record

      # The artifact binds the key to this run: decide finds it by name in the
      # run the key names. It comes first, so a marker never exists without it.
      # A marker that cannot be recorded only means the next run runs in full.
      - name: Upload the marker artifact
        id: upload
        if: steps.record.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: ${{ runner.temp }}/tree-pass-marker
          if-no-files-found: error
          retention-days: 14

      - name: Save the marker
        if: steps.record.outputs.ok == 'true' && steps.upload.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/tree-pass-marker
          key: ${{ steps.record.outputs.key }}
